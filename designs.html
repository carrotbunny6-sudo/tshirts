<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6M 潮流升华球衣 4 款 | 4 Reka Bentuk Jersi Trendy 6M</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@8..144,500..900,100&family=Noto+Sans+SC:wght@500;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-stage: radial-gradient(circle at 50% 42%, #f4efe6 0%, #e1d9cb 75%, #cfc5b4 100%);
      --hud-bg: rgba(255, 253, 248, 0.95);
      --hud-border: rgba(28, 25, 20, 0.2);
      --ink-main: #151412;
      --ink-sub: #4c463d;
      --accent: #1d57b8;
      --accent-ink: #ffffff;
      --btn-bg: #ebe3d5;
      --shadow-hud: 0 10px 30px rgba(38, 28, 16, 0.14);
      --font-ui: "Google Sans Flex", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-rounded, sans-serif;
    }

    [data-backdrop="dark"] {
      --bg-stage: radial-gradient(circle at 50% 42%, #2b3038 0%, #181c22 72%, #0e1116 100%);
      --hud-bg: rgba(25, 29, 36, 0.95);
      --hud-border: rgba(255, 255, 255, 0.22);
      --ink-main: #f9f6f0;
      --ink-sub: #cec7bc;
      --accent: #ffd452;
      --accent-ink: #181611;
      --btn-bg: #343a46;
      --shadow-hud: 0 12px 34px rgba(0, 0, 0, 0.56);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-stage);
      color: var(--ink-main);
      font-family: var(--font-ui);
      font-variation-settings: "ROND" 100;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shirt-page {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 68px 64px 78px;
    }

    .shirt-page.active {
      display: flex;
      animation: pageFade 0.25s ease-out;
    }

    @keyframes pageFade {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    .shirt-canvas-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 50% 45%;
    }

    .shirt-page[data-side="front"] .shirt-canvas-wrap { transform-origin: 50% 38%; }
    .shirt-page[data-side="back"]  .shirt-canvas-wrap { transform-origin: 50% 53%; }

    .viewport.zoomed .shirt-page[data-side="front"] .shirt-canvas-wrap {
      transform: scale(1.9);
      cursor: zoom-out;
    }

    .viewport.zoomed .shirt-page[data-side="back"] .shirt-canvas-wrap {
      transform: scale(1.66);
      cursor: zoom-out;
    }

    .shirt-svg {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      filter: drop-shadow(0 26px 40px rgba(26, 22, 16, 0.28));
    }

    .top-hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .hud-pill {
      pointer-events: auto;
      background: var(--hud-bg);
      border: 2px solid var(--hud-border);
      border-radius: 999px;
      box-shadow: var(--shadow-hud);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .color-chip {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--hud-border);
      flex-shrink: 0;
    }

    .title-stack {
      display: flex;
      flex-direction: column;
      line-height: 1.18;
    }

    .title-zh {
      font-size: clamp(1rem, 2.1vw, 1.38rem);
      font-weight: 800;
      color: var(--ink-main);
    }

    .title-bm {
      font-size: clamp(0.75rem, 1.35vw, 0.92rem);
      font-weight: 700;
      color: var(--ink-sub);
    }

    .hud-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      border: 2px solid var(--hud-border);
      background: var(--hud-bg);
      color: var(--ink-main);
      font-family: var(--font-ui);
      font-variation-settings: "ROND" 100;
      border-radius: 999px;
      padding: 8px 16px;
      min-height: 48px;
      cursor: pointer;
      box-shadow: var(--shadow-hud);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      transition: transform 0.15s ease, background 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .hud-btn:hover { transform: translateY(-1px); }

    .hud-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .hud-btn .zh { font-size: 0.96rem; font-weight: 800; }
    .hud-btn .bm { font-size: 0.72rem; font-weight: 700; opacity: 0.9; }

    .side-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--hud-border);
      background: var(--hud-bg);
      color: var(--ink-main);
      font-size: 2.1rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-hud);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .side-nav:hover:not(:disabled) {
      background: var(--accent);
      color: var(--accent-ink);
      transform: translateY(-50%) scale(1.06);
    }

    .side-nav:disabled { opacity: 0.25; cursor: not-allowed; }
    .side-prev { left: 16px; }
    .side-next { right: 16px; }

    .bottom-hud {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      background: var(--hud-bg);
      border: 2px solid var(--hud-border);
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: var(--shadow-hud);
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .bottom-hud::-webkit-scrollbar { display: none; }

    .page-dot {
      border: none;
      background: var(--btn-bg);
      color: var(--ink-main);
      font-family: var(--font-ui);
      font-weight: 800;
      font-size: 0.88rem;
      min-width: 48px;
      height: 42px;
      padding: 0 10px;
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }

    .page-dot.active {
      background: var(--accent);
      color: var(--accent-ink);
      min-width: 60px;
    }

    .divider-bar {
      width: 2px;
      height: 22px;
      background: var(--hud-border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    @media (max-width: 780px) {
      .shirt-page { padding: 74px 10px 76px; }
      .side-nav { width: 48px; height: 48px; font-size: 1.7rem; }
      .side-prev { left: 8px; }
      .side-next { right: 8px; }
      .hud-pill { padding: 6px 12px; }
      .hud-btn { padding: 6px 12px; min-height: 44px; }
    }
  </style>
</head>
<body data-backdrop="light">
  <div class="viewport" id="viewport">

    <header class="top-hud">
      <div class="hud-pill" aria-live="polite">
        <span class="color-chip" id="hudColorChip"></span>
        <div class="title-stack">
          <span class="title-zh" id="hudTitleZh"></span>
          <span class="title-bm" id="hudTitleBm"></span>

    <main id="pagesHost" style="width:100%; height:100%; position:relative;"></main>

  <script>

      const PAGES = [

          short: "4背"

      ];

      function buildRoster(inkMain, inkAccent, startY, lineGap, fontSize = 12.8) {
        const left = STUDENTS.slice(0, 14);
        const right = STUDENTS.slice(14, 27);
        let svg = "";

        left.forEach((name, i) => {
          const y = startY + i * lineGap;
          svg += `<text x="440" y="${y}" text-anchor="end" fill="${inkMain}" font-size="${fontSize}" font-weight="800" letter-spacing="0.25">${name}</text>`;
        });

        right.forEach((name, i) => {
          const y = startY + i * lineGap;
          svg += `<text x="460" y="${y}" text-anchor="start" fill="${inkMain}" font-size="${fontSize}" font-weight="800" letter-spacing="0.25">${name}</text>`;
        });

        const endY = startY + 13 * lineGap;
        svg += `<text x="460" y="${endY}" text-anchor="start" fill="${inkAccent}" font-size="${fontSize}" font-weight="900" letter-spacing="0.4">★ 6M • 2026</text>`;
        return svg;
      }

      function star4(cx, cy, r, fill) {
        const ir = r * 0.28;
        return `<path d="M${cx},${cy - r} L${cx + ir},${cy - ir} L${cx + r},${cy} L${cx + ir},${cy + ir} L${cx},${cy + r} L${cx - ir},${cy + ir} L${cx - r},${cy} L${cx - ir},${cy - ir} Z" fill="${fill}"/>`;
      }

      function buildTemplateLayers(cfg, uid) {
        const { tpl, side } = cfg;
        const isFront = side === "front";

        // ============================================================
        // 1. HEX: 3D Hex Esports Jersey (Inspired by B (968) & B (629))
        // ============================================================
        if (tpl === "HEX") {
          const cyan = "#3bf0ff";
          const neonGold = "#ffe44d";
          const royal = "#1f53d4";
          const deepBlue = "#0e225c";

          const fabricPattern = `
            <defs>
              <linearGradient id="esportsBg_${uid}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1744b8"/>
                <stop offset="55%" stop-color="#193b9c"/>
                <stop offset="100%" stop-color="${deepBlue}"/>
              </linearGradient>
              <pattern id="hex3d_${uid}" width="44" height="38" patternUnits="userSpaceOnUse">
                <polygon points="22,2 40,11 40,27 22,36 4,27 4,11" fill="rgba(59,240,255,0.06)" stroke="rgba(59,240,255,0.28)" stroke-width="1.4"/>
                <polyline points="4,11 22,20 40,11" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>
                <line x1="22" y1="20" x2="22" y2="36" stroke="rgba(14,34,92,0.4)" stroke-width="1.4"/>
              </pattern>
            </defs>

            <rect x="70" y="75" width="760" height="810" fill="url(#esportsBg_${uid})"/>
            <rect x="70" y="75" width="760" height="810" fill="url(#hex3d_${uid})"/>

            <!-- Dynamic Cyan & Neon Gold Esports Shoulder Panels -->
            <polygon points="70,120 350,75 280,270 70,320" fill="${cyan}" opacity="0.24"/>
            <polygon points="830,120 550,75 620,270 830,320" fill="${cyan}" opacity="0.24"/>
            <!-- Cyber Side Chevrons -->
            <polygon points="250,330 302,380 278,510 250,480" fill="${cyan}" opacity="0.45"/>
            <polygon points="650,330 598,380 622,510 650,480" fill="${cyan}" opacity="0.45"/>
            <polygon points="250,515 286,555 272,660 250,635" fill="${neonGold}" opacity="0.72"/>
            <polygon points="650,515 614,555 628,660 650,635" fill="${neonGold}" opacity="0.72"/>

            <!-- Dual Sleeve Speed Stripes -->
            <path d="M84,292 L214,380 L206,392 L76,304 Z" fill="${cyan}"/>
            <path d="M74,308 L204,396 L196,408 L66,320 Z" fill="${neonGold}"/>
            <path d="M816,292 L686,380 L694,392 L824,304 Z" fill="${cyan}"/>
            <path d="M826,308 L696,396 L704,408 L834,320 Z" fill="${neonGold}"/>
          `;

          const printArt = isFront
            ? `
              <!-- Solid Dark-Blue Cyber Crest Backing for Maximum Pop -->
              <polygon points="450,248 594,296 570,456 450,504 330,456 306,296"
                       fill="rgba(10, 22, 62, 0.88)" stroke="${cyan}" stroke-width="3.5"/>
              <polygon points="450,260 582,303 560,448 450,492 340,448 318,303"
                       fill="none" stroke="${neonGold}" stroke-width="1.5" opacity="0.8"/>

              <!-- Cyber Wing Lines -->
              <polyline points="354,318 394,318 408,330" fill="none" stroke="${cyan}" stroke-width="3" stroke-linecap="round"/>
              <polyline points="546,318 506,318 492,330" fill="none" stroke="${cyan}" stroke-width="3" stroke-linecap="round"/>
              ${star4(450, 294, 10, neonGold)}

              <text x="455" y="394" text-anchor="middle" fill="${cyan}" font-size="76" font-weight="900" letter-spacing="4" opacity="0.65">6M</text>
              <text x="450" y="389" text-anchor="middle" fill="#ffffff" font-size="76" font-weight="900" letter-spacing="4">6M</text>

              <text x="450" y="432" text-anchor="middle" fill="${neonGold}" font-size="22.5" font-weight="900" letter-spacing="2">武吉港脚南华学校</text>
              <rect x="364" y="446" width="172" height="28" rx="14" fill="${cyan}"/>
              <text x="450" y="466" text-anchor="middle" fill="#09163c" font-size="15.5" font-weight="900" letter-spacing="1.6">2026 毕业解锁</text>
            `
            : `
              <!-- High-Opacity Dark HUD Roster Panel (Zero Mesh Interference!) -->
              <path d="M294,254 H606 L622,272 V762 L606,778 H294 L278,762 V272 Z"
                    fill="rgba(10, 22, 62, 0.91)" stroke="${cyan}" stroke-width="3"/>
              <rect x="294" y="262" width="312" height="26" fill="${cyan}" opacity="0.2"/>
              <text x="450" y="281" text-anchor="middle" fill="${cyan}" font-size="14" font-weight="900" letter-spacing="2">★ 6M • 玩家全员集合 ★</text>

              <text x="450" y="324" text-anchor="middle" fill="${neonGold}" font-size="22" font-weight="900" letter-spacing="2.5">武吉港脚南华学校</text>
              <line x1="302" y1="342" x2="598" y2="342" stroke="${cyan}" stroke-width="1.5" opacity="0.55"/>
              <line x1="450" y1="358" x2="450" y2="704" stroke="${cyan}" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.38"/>

              ${buildRoster("#ffffff", neonGold, 378, 24, 12.8)}

              <rect x="316" y="724" width="268" height="38" rx="8" fill="${neonGold}"/>

          return { fabricPattern, printArt, collarFill: cyan, collarStroke: "rgba(0,0,0,0.2)" };
        }

        // ============================================================
        // 2. MARBLE: Liquid Marble Artist-Collab (Inspired by B (857) & B (907))
        // ============================================================
        if (tpl === "MARBLE") {
          const navy  = "#152b5e";
          const blue  = "#2468e0";
          const sky   = "#5fd4ff";
          const coral = "#ff5478";
          const gold  = "#ffd147";

          const fabricPattern = `

            <path d="M780,75 C745,145 685,175 635,145 C605,126 595,95 585,75 Z" fill="${blue}" opacity="0.78"/>

            <!-- Bottom Flowing Liquid Swirl -->
            <path d="M220,885 V760 C310,730 390,790 480,765 C565,742 620,705 680,740 V885 Z" fill="${blue}" opacity="0.88"/>
            <path d="M220,885 V795 C320,765 410,825 510,790 C585,765 630,745 680,780 V885 Z" fill="${sky}" opacity="0.68"/>
            <path d="M220,885 V825 C340,795 430,855 540,818 C605,795 640,790 680,820 V885 Z" fill="${coral}" opacity="0.65"/>
            <path d="M280,885 C360,840 460,865 560,840 C610,828 650,840 680,860 V885 Z" fill="${gold}" opacity="0.75"/>
          `;

          const printArt = isFront
            ? `
              <!-- Clean Floating White Boutique Card -->
              <rect x="304" y="254" width="292" height="226" rx="28" fill="rgba(255,255,255,0.94)" stroke="${navy}" stroke-width="3.5"/>
              ${star4(340, 288, 9, coral)}
              ${star4(560, 288, 9, sky)}

              <text x="454" y="376" text-anchor="middle" fill="${sky}" font-size="78" font-weight="900" letter-spacing="4">6M</text>
              <text x="450" y="372" text-anchor="middle" fill="${navy}" font-size="78" font-weight="900" letter-spacing="4">6M</text>

              <text x="450" y="416" text-anchor="middle" fill="${navy}" font-size="24" font-weight="900" letter-spacing="2.2">武吉港脚南华学校</text>

              <rect x="342" y="434" width="216" height="32" rx="16" fill="${coral}"/>
              <text x="450" y="456" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="900" letter-spacing="2">2026 • 六年限定版</text>
            `
            : `
              <!-- Crisp Solid White Gallery Card Centered Cleanly Over Marble -->
              <rect x="278" y="250" width="344" height="516" rx="26" fill="rgba(255,255,255,0.97)" stroke="${navy}" stroke-width="3.5"/>

              <text x="450" y="290" text-anchor="middle" fill="${blue}" font-size="23" font-weight="900" letter-spacing="2.5">武吉港脚南华学校</text>
              <text x="450" y="322" text-anchor="middle" fill="${coral}" font-size="20" font-weight="900" letter-spacing="3">6M • 2026 毕业快乐</text>
              <line x1="304" y1="338" x2="596" y2="338" stroke="${navy}" stroke-width="1.8" opacity="0.25"/>

              <line x1="450" y1="356" x2="450" y2="696" stroke="${blue}" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.35"/>
              ${buildRoster(navy, coral, 374, 23.4, 12.8)}

              <rect x="314" y="712" width="272" height="36" rx="18" fill="${navy}"/>
              <text x="450" y="736" text-anchor="middle" fill="${gold}" font-size="18" font-weight="900" letter-spacing="2.4">永远的六M • 一路顺风</text>
            `;

          return { fabricPattern, printArt, collarFill: navy, collarStroke: "rgba(255,255,255,0.22)" };
        }

        // ============================================================
        // 3. SLASH: Pro Champion Gold-Slash (Inspired by B (277) & B (183))
        // ============================================================
        if (tpl === "SLASH") {
          const gold  = "#ffd447";
          const sky   = "#5ce1ff";
          const bHi   = "#2b62d1";
          const bMid  = "#1c46a3";
          const bLo   = "#0f2966";

          const fabricPattern = `
            <defs>
              <radialGradient id="champ_${uid}" cx="50%" cy="38%" r="58%">
                <stop offset="0%" stop-color="${bHi}"/>
                <stop offset="56%" stop-color="${bMid}"/>
                <stop offset="100%" stop-color="${bLo}"/>
              </radialGradient>
            </defs>

            <rect x="70" y="75" width="760" height="810" fill="url(#champ_${uid})"/>

            <!-- Dynamic Diagonal Gold & Sky-Blue Athletic Sashes -->
            <polygon points="70,560 830,300 830,342 70,602" fill="${gold}" opacity="0.88"/>
            <polygon points="70,618 830,358 830,382 70,642" fill="${sky}" opacity="0.65"/>
            <polygon points="70,660 830,400 830,414 70,674" fill="#ffffff" opacity="0.28"/>

            <!-- Sporty Sleeve Stripes -->
            <path d="M84,292 L214,380 L206,392 L76,304 Z" fill="#ffffff"/>
            <path d="M74,308 L204,396 L196,408 L66,320 Z" fill="${gold}"/>
            <path d="M816,292 L686,380 L694,392 L824,304 Z" fill="#ffffff"/>
            <path d="M826,308 L696,396 L704,408 L834,320 Z" fill="${gold}"/>
          `;

          const printArt = isFront
            ? `
              <!-- Solid Royal-Navy Crest Shield Protecting Front Text from Gold Slash -->
              <path d="M312,260 H588 V414 C588,458 450,498 450,498 C450,498 312,458 312,414 Z"
                    fill="rgba(14, 34, 84, 0.92)" stroke="${gold}" stroke-width="4"/>
              <defs>
                <path id="archS_${uid}" d="M 326,326 Q 450,268 574,326"/>
              </defs>
              <text fill="#ffffff" font-size="23" font-weight="900" letter-spacing="2.5">
                <textPath href="#archS_${uid}" startOffset="50%" text-anchor="middle">武吉港脚南华学校</textPath>
              </text>

              <text x="454" y="406" text-anchor="middle" fill="${sky}" font-size="74" font-weight="900" letter-spacing="4" opacity="0.55">6M</text>
              <text x="450" y="402" text-anchor="middle" fill="${gold}" font-size="74" font-weight="900" letter-spacing="4">6M</text>
              ${star4(360, 376, 9, "#ffffff")}
              ${star4(540, 376, 9, "#ffffff")}

              <rect x="352" y="424" width="196" height="34" rx="17" fill="${gold}"/>
              <text x="450" y="447" text-anchor="middle" fill="#112352" font-size="18" font-weight="900" letter-spacing="2">2026 毕业快乐</text>
            `
            : `
              <!-- Dedicated High-Contrast Royal Navy Panel (Zero Slash Collision!) -->
              <rect x="278" y="252" width="344" height="516" rx="24" fill="rgba(13, 33, 82, 0.93)" stroke="${gold}" stroke-width="3.5"/>

              <text x="450" y="292" text-anchor="middle" fill="${gold}" font-size="23" font-weight="900" letter-spacing="2.5">武吉港脚南华学校</text>
              <text x="450" y="324" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="3">6M • 2026 毕业纪念</text>
              <line x1="304" y1="340" x2="596" y2="340" stroke="${sky}" stroke-width="1.8" opacity="0.65"/>

              <line x1="450" y1="358" x2="450" y2="696" stroke="${gold}" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.45"/>
              ${buildRoster("#ffffff", gold, 376, 23.4, 12.8)}

              <rect x="314" y="714" width="272" height="36" rx="18" fill="${gold}"/>
              <text x="450" y="738" text-anchor="middle" fill="#112352" font-size="18.5" font-weight="900" letter-spacing="2.4">梦想起飞 • 前程似锦</text>
            `;

          return { fabricPattern, printArt, collarFill: gold, collarStroke: "rgba(0,0,0,0.2)" };
        }

        // ============================================================
        // 4. COMIC: Pop-Art Halftone Burst (Inspired by B (775) & B (59))
        // ============================================================
        const ink    = "#18243c";
        const cobalt = "#2563eb";
        const coral  = "#ff4778";
        const sunny  = "#ffd43b";

        const fabricPattern = `
          <defs>
            <pattern id="dots_${uid}" width="18" height="18" patternUnits="userSpaceOnUse">
              <circle cx="9" cy="9" r="3.2" fill="${cobalt}" opacity="0.16"/>
            </pattern>
          </defs>

          <rect x="70" y="75" width="760" height="810" fill="#ffffff"/>
          <rect x="70" y="75" width="760" height="810" fill="url(#dots_${uid})"/>

          <!-- Bold Pop-Art Comic Sleeves & Corner Bursts -->
          <polygon points="70,75 310,75 230,270 70,350" fill="${cobalt}"/>
          <polygon points="830,75 590,75 670,270 830,350" fill="${coral}"/>
          <polygon points="220,885 220,735 395,885" fill="${sunny}"/>
          <polygon points="680,885 680,735 505,885" fill="${cobalt}"/>

          <!-- Sleeve Cuff Bands -->
          <path d="M74,306 L208,396 L196,412 L64,322 Z" fill="${sunny}"/>
          <path d="M826,306 L692,396 L704,412 L836,322 Z" fill="${sunny}"/>
        `;

        const printArt = isFront
          ? `
            <!-- Offset Yellow Comic Shadow + White Card -->
            <rect x="306" y="264" width="308" height="222" rx="30" fill="${sunny}" stroke="${ink}" stroke-width="4.5"/>
            <rect x="296" y="254" width="308" height="222" rx="30" fill="#ffffff" stroke="${ink}" stroke-width="4.5"/>

            <!-- Tilted Graduation Cap on 6M -->
            <g transform="translate(500, 286) rotate(14)">
              <polygon points="0,-16 32,-4 0,8 -32,-4" fill="${coral}" stroke="${ink}" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M-16,4 L-16,15 C-16,19 16,19 16,15 L16,4 L0,10 Z" fill="${sunny}" stroke="${ink}" stroke-width="3"/>
              <line x1="26" y1="-2" x2="28" y2="16" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>
              <circle cx="28" cy="18" r="4" fill="${sunny}" stroke="${ink}" stroke-width="2.5"/>
            </g>

            <text x="454" y="382" text-anchor="middle" fill="${sunny}" stroke="${ink}" stroke-width="11" paint-order="stroke" font-size="80" font-weight="900" letter-spacing="4">6M</text>
            <text x="448" y="377" text-anchor="middle" fill="${cobalt}" stroke="${ink}" stroke-width="6" paint-order="stroke" font-size="80" font-weight="900" letter-spacing="4">6M</text>

            <text x="450" y="420" text-anchor="middle" fill="${ink}" font-size="23" font-weight="900" letter-spacing="1.8">武吉港脚南华学校</text>

            <rect x="342" y="434" width="216" height="34" rx="17" fill="${coral}" stroke="${ink}" stroke-width="3.5"/>
            <text x="450" y="457" text-anchor="middle" fill="#ffffff" font-size="17.5" font-weight="900" letter-spacing="2">2026 毕业啦！</text>
          `
          : `
            <!-- Offset Yellow Comic Shadow + Solid White Card -->
            <rect x="288" y="262" width="344" height="504" rx="26" fill="${sunny}" stroke="${ink}" stroke-width="4.5"/>
            <rect x="278" y="252" width="344" height="504" rx="26" fill="#ffffff" stroke="${ink}" stroke-width="4.5"/>

            <rect x="312" y="268" width="276" height="38" rx="19" fill="${cobalt}" stroke="${ink}" stroke-width="3.5"/>
            <text x="450" y="294" text-anchor="middle" fill="#ffffff" font-size="20.5" font-weight="900" letter-spacing="2.2">我们毕业啦 • 6M</text>

            <text x="450" y="334" text-anchor="middle" fill="${coral}" font-size="16" font-weight="900" letter-spacing="2">★ 武吉港脚南华学校 ★</text>
            <line x1="302" y1="346" x2="598" y2="346" stroke="${ink}" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.35"/>

            ${buildRoster(ink, coral, 372, 23.4, 12.8)}

            <rect x="314" y="704" width="272" height="38" rx="19" fill="${coral}" stroke="${ink}" stroke-width="3.5"/>
            <text x="450" y="730" text-anchor="middle" fill="#ffffff" font-size="18.5" font-weight="900" letter-spacing="2.2">青春万岁 • 快乐出发！</text>
          `;

        return { fabricPattern, printArt, collarFill: ink, collarStroke: "rgba(255,255,255,0.22)" };
      }

      function buildShirtSvg(cfg) {
        const uid = `p${cfg.id}`;
        const isFront = cfg.side === "front";
        const { fabricPattern, printArt, collarFill, collarStroke } = buildTemplateLayers(cfg, uid);

        const stitchColor = cfg.isLight ? "rgba(0,0,0,0.16)" : "rgba(255,255,255,0.22)";
        const creaseDark  = cfg.isLight ? "rgba(45,48,58,0.18)" : "rgba(0,0,0,0.3)";
        const creaseLight = cfg.isLight ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.18)";

        const bodyPath = isFront
          ? "M360,82 C388,162 512,162 540,82 L674,122 L822,318 L704,400 L646,312 L646,842 C646,862 634,872 612,872 L288,872 C266,872 254,862 254,842 L254,312 L196,400 L78,318 L226,122 Z"
          : "M356,82 C398,108 502,108 544,82 L674,122 L822,318 L704,400 L646,312 L646,842 C646,862 634,872 612,872 L288,872 C266,872 254,862 254,842 L254,312 L196,400 L78,318 L226,122 Z";

        const collarMarkup = isFront
          ? `
            <path d="M358,82 C402,94 498,94 542,82 C516,158 384,158 358,82 Z" fill="rgba(0,0,0,0.25)"/>
            <rect x="427" y="96" width="46" height="25" rx="4" fill="rgba(255,255,255,0.88)"/>
            <text x="450" y="112" text-anchor="middle" fill="#1a2234" font-size="9.5" font-weight="900">6M</text>
            <path d="M348,85 C382,174 518,174 552,85 L536,80 C508,154 392,154 364,80 Z" fill="${collarFill}" stroke="${collarStroke}" stroke-width="1.6"/>
          `
          : `
            <path d="M352,83 C396,112 504,112 548,83 L539,74 C498,98 402,98 361,74 Z" fill="${collarFill}" stroke="${collarStroke}" stroke-width="1.6"/>
          `;

        return `
          <svg class="shirt-svg" viewBox="0 0 900 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${cfg.zh} / ${cfg.bm}">
            <defs>
              <filter id="weave_${uid}" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" result="noise"/>
                <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0" in="noise" result="softNoise"/>
                <feComposite in="softNoise" in2="SourceGraphic" operator="atop"/>
              </filter>

              <linearGradient id="sideShade_${uid}" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="${creaseDark}"/>
                <stop offset="14%" stop-color="transparent"/>
                <stop offset="86%" stop-color="transparent"/>
                <stop offset="100%" stop-color="${creaseDark}"/>
              </linearGradient>

              <clipPath id="clipShirt_${uid}">
                <path d="${bodyPath}"/>
              </clipPath>
            </defs>

            <g clip-path="url(#clipShirt_${uid})">
              ${fabricPattern}

              <rect x="78" y="80" width="744" height="800" fill="url(#sideShade_${uid})"/>
              <path d="M254,312 C282,324 308,356 318,402" fill="none" stroke="${creaseDark}" stroke-width="15" stroke-linecap="round" opacity="0.25"/>
              <path d="M646,312 C618,324 592,356 582,402" fill="none" stroke="${creaseDark}" stroke-width="15" stroke-linecap="round" opacity="0.25"/>
              <path d="M274,742 C340,768 560,768 626,742" fill="none" stroke="${creaseLight}" stroke-width="24" opacity="0.2"/>
              <path d="M282,810 C360,830 540,830 618,810" fill="none" stroke="${creaseDark}" stroke-width="18" opacity="0.18"/>

              <path d="M226,122 C245,190 250,255 254,312" fill="none" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>
              <path d="M674,122 C655,190 650,255 646,312" fill="none" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>
              <line x1="254" y1="846" x2="646" y2="846" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>
              <line x1="254" y1="853" x2="646" y2="853" stroke="${stitchColor}" stroke-width="1.5" stroke-dasharray="4 4"/>

              <g id="print_${uid}">
                ${printArt}
              </g>

              <rect x="78" y="80" width="744" height="800" fill="transparent" filter="url(#weave_${uid})"/>
              <ellipse cx="450" cy="460" rx="220" ry="260" fill="${creaseLight}" opacity="0.06" pointer-events="none"/>
            </g>

            ${collarMarkup}
            <path d="${bodyPath}" fill="none" stroke="${cfg.isLight ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.18)'}" stroke-width="2"/>
          </svg>
        `;
      }

      const viewport = document.getElementById("viewport");
      const pagesHost = document.getElementById("pagesHost");
      const bottomHud = document.getElementById("bottomHud");
      const hudTitleZh = document.getElementById("hudTitleZh");
      const hudTitleBm = document.getElementById("hudTitleBm");
      const hudColorChip = document.getElementById("hudColorChip");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const zoomBtn = document.getElementById("zoomBtn");
      const backdropBtn = document.getElementById("backdropBtn");

      let currentIdx = 0;

      PAGES.forEach((cfg, idx) => {
        const sec = document.createElement("section");
        sec.className = "shirt-page" + (idx === 0 ? " active" : "");
        sec.dataset.side = cfg.side;
        sec.innerHTML = `<div class="shirt-canvas-wrap">${buildShirtSvg(cfg)}</div>`;
        sec.querySelector(".shirt-canvas-wrap").addEventListener("click", () => toggleZoom());
        pagesHost.appendChild(sec);

        if (idx > 0 && idx % 2 === 0) {
          const div = document.createElement("span");
          div.className = "divider-bar";
          bottomHud.appendChild(div);
        }

        const dot = document.createElement("button");
        dot.className = "page-dot" + (idx === 0 ? " active" : "");
        dot.textContent = cfg.short;
        dot.setAttribute("aria-label", `${cfg.zh} / ${cfg.bm}`);
        dot.addEventListener("click", () => goToPage(idx));
        bottomHud.appendChild(dot);
      });

      const pageEls = Array.from(document.querySelectorAll(".shirt-page"));
      const dotEls = Array.from(document.querySelectorAll(".page-dot"));

      function updateHud() {
        const cfg = PAGES[currentIdx];
        hudTitleZh.textContent = cfg.zh;
        hudTitleBm.textContent = cfg.bm;
        hudColorChip.style.background = cfg.chip;
        prevBtn.disabled = currentIdx === 0;
        nextBtn.disabled = currentIdx === PAGES.length - 1;
        dotEls[currentIdx].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }

      function goToPage(idx) {
        if (idx < 0 || idx >= PAGES.length || idx === currentIdx) return;
        pageEls[currentIdx].classList.remove("active");
        dotEls[currentIdx].classList.remove("active");
        currentIdx = idx;
        pageEls[currentIdx].classList.add("active");
        dotEls[currentIdx].classList.add("active");
        updateHud();
      }

      function toggleZoom(forceState) {
        const nextState = typeof forceState === "boolean" ? forceState : !viewport.classList.contains("zoomed");
        viewport.classList.toggle("zoomed", nextState);
        zoomBtn.classList.toggle("active", nextState);
        zoomBtn.setAttribute("aria-pressed", String(nextState));
      }

      zoomBtn.addEventListener("click", () => toggleZoom());

      backdropBtn.addEventListener("click", () => {
        const isDark = document.body.getAttribute("data-backdrop") === "dark";
        document.body.setAttribute("data-backdrop", isDark ? "light" : "dark");
        backdropBtn.classList.toggle("active", !isDark);
        backdropBtn.setAttribute("aria-pressed", String(!isDark));
      });

      prevBtn.addEventListener("click", () => goToPage(currentIdx - 1));
      nextBtn.addEventListener("click", () => goToPage(currentIdx + 1));

      document.addEventListener("keydown", e => {
        if (e.key === "ArrowRight" || e.key === "PageDown") {
          e.preventDefault();
          goToPage(currentIdx + 1);
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          goToPage(currentIdx - 1);
        } else if (e.key === " " || e.key === "z" || e.key === "Z") {
          e.preventDefault();
          toggleZoom();
        }
      });

      let touchX = 0;
      let touchY = 0;
      viewport.addEventListener("touchstart", e => {
        touchX = e.changedTouches[0].screenX;
        touchY = e.changedTouches[0].screenY;
      }, { passive: true });

      viewport.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].screenX - touchX;
        const dy = e.changedTouches[0].screenY - touchY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) goToPage(currentIdx + 1);
          else goToPage(currentIdx - 1);
        }
      }, { passive: true });

      updateHud();
    })();
  </script>
</body>
</html>
