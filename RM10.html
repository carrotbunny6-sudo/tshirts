<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6M 毕业班服精选 3 款 (RM10) | 3 Reka Bentuk Baju Kelas 6M (RM10)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@8..144,500..900,100&family=Noto+Sans+SC:wght@500;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-stage: radial-gradient(circle at 50% 42%, #f4efe6 0%, #e1d9cb 75%, #cfc5b4 100%);
      --hud-bg: rgba(255, 253, 248, 0.95);
      --hud-border: rgba(28, 25, 20, 0.2);
      --ink-main: #151412;
      --ink-sub: #4c463d;
      --accent: #1d57b8;
      --accent-ink: #ffffff;
      --btn-bg: #ebe3d5;
      --shadow-hud: 0 10px 30px rgba(38, 28, 16, 0.14);
      --font-ui: "Google Sans Flex", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-rounded, sans-serif;
    }

    [data-backdrop="dark"] {
      --bg-stage: radial-gradient(circle at 50% 42%, #2b3038 0%, #181c22 72%, #0e1116 100%);
      --hud-bg: rgba(25, 29, 36, 0.95);
      --hud-border: rgba(255, 255, 255, 0.22);
      --ink-main: #f9f6f0;
      --ink-sub: #cec7bc;
      --accent: #ffd452;
      --accent-ink: #181611;
      --btn-bg: #343a46;
      --shadow-hud: 0 12px 34px rgba(0, 0, 0, 0.56);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-stage);
      color: var(--ink-main);
      font-family: var(--font-ui);
      font-variation-settings: "ROND" 100;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shirt-page {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 68px 64px 78px;
    }

    .shirt-page.active {
      display: flex;
      animation: pageFade 0.25s ease-out;
    }

    @keyframes pageFade {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    .shirt-canvas-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 50% 45%;
    }

    .shirt-page[data-side="front"] .shirt-canvas-wrap { transform-origin: 50% 38%; }
    .shirt-page[data-side="back"]  .shirt-canvas-wrap { transform-origin: 50% 53%; }

    .viewport.zoomed .shirt-page[data-side="front"] .shirt-canvas-wrap {
      transform: scale(1.9);
      cursor: zoom-out;
    }

    .viewport.zoomed .shirt-page[data-side="back"] .shirt-canvas-wrap {
      transform: scale(1.66);
      cursor: zoom-out;
    }

    .shirt-svg {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      filter: drop-shadow(0 26px 40px rgba(26, 22, 16, 0.28));
    }

    .top-hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .hud-pill {
      pointer-events: auto;
      background: var(--hud-bg);
      border: 2px solid var(--hud-border);
      border-radius: 999px;
      box-shadow: var(--shadow-hud);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .color-chip {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--hud-border);
      flex-shrink: 0;
    }

    .title-stack {
      display: flex;
      flex-direction: column;
      line-height: 1.18;
    }

    .title-zh {
      font-size: clamp(1rem, 2.1vw, 1.38rem);
      font-weight: 800;
      color: var(--ink-main);
    }

    .title-bm {
      font-size: clamp(0.75rem, 1.35vw, 0.92rem);
      font-weight: 700;
      color: var(--ink-sub);
    }

    .hud-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      border: 2px solid var(--hud-border);
      background: var(--hud-bg);
      color: var(--ink-main);
      font-family: var(--font-ui);
      font-variation-settings: "ROND" 100;
      border-radius: 999px;
      padding: 8px 16px;
      min-height: 48px;
      cursor: pointer;
      box-shadow: var(--shadow-hud);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      transition: transform 0.15s ease, background 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .hud-btn:hover { transform: translateY(-1px); }

    .hud-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .hud-btn .zh { font-size: 0.96rem; font-weight: 800; }
    .hud-btn .bm { font-size: 0.72rem; font-weight: 700; opacity: 0.9; }

    .side-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--hud-border);
      background: var(--hud-bg);
      color: var(--ink-main);
      font-size: 2.1rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-hud);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .side-nav:hover:not(:disabled) {
      background: var(--accent);
      color: var(--accent-ink);
      transform: translateY(-50%) scale(1.06);
    }

    .side-nav:disabled { opacity: 0.25; cursor: not-allowed; }
    .side-prev { left: 16px; }
    .side-next { right: 16px; }

    .bottom-hud {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      background: var(--hud-bg);
      border: 2px solid var(--hud-border);
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: var(--shadow-hud);
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .bottom-hud::-webkit-scrollbar { display: none; }

    .page-dot {
      border: none;
      background: var(--btn-bg);
      color: var(--ink-main);
      font-family: var(--font-ui);
      font-weight: 800;
      font-size: 0.84rem;
      min-width: 44px;
      height: 40px;
      padding: 0 9px;
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }

    .page-dot.active {
      background: var(--accent);
      color: var(--accent-ink);
      min-width: 56px;
    }

    .divider-bar {
      width: 2px;
      height: 22px;
      background: var(--hud-border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    @media (max-width: 780px) {
      .shirt-page { padding: 74px 10px 76px; }
      .side-nav { width: 48px; height: 48px; font-size: 1.7rem; }
      .side-prev { left: 8px; }
      .side-next { right: 8px; }
      .hud-pill { padding: 6px 12px; }
      .hud-btn { padding: 6px 12px; min-height: 44px; }
    }
  </style>
</head>
<body data-backdrop="light">
  <div class="viewport" id="viewport">

    <header class="top-hud">
      <div class="hud-pill" aria-live="polite">
        <span class="color-chip" id="hudColorChip"></span>
        <div class="title-stack">
          <span class="title-zh" id="hudTitleZh"></span>
          <span class="title-bm" id="hudTitleBm"></span>
        </div>
      </div>

      <div class="hud-actions">
        <button class="hud-btn" id="zoomBtn" aria-pressed="false">
          <span class="zh">放大</span>
          <span class="bm">Zum</span>
        </button>
        <button class="hud-btn" id="backdropBtn" aria-pressed="false">
          <span class="zh">深底</span>
          <span class="bm">Gelap</span>
        </button>
      </div>
    </header>

    <main id="pagesHost" style="width:100%; height:100%; position:relative;"></main>

    <button class="side-nav side-prev" id="prevBtn" aria-label="上一页 / Sebelum">‹</button>
    <button class="side-nav side-next" id="nextBtn" aria-label="下一页 / Seterusnya">›</button>

    <nav class="bottom-hud" id="bottomHud" aria-label="页码 / Halaman"></nav>
  </div>

  <script>
    (() => {
      const STUDENTS = [

        "CINDY TOH",
        "EDEN LAU",
        "FOO SI SHENG",
        "GAN JIE FOHNG",
        "GAN ONG SIN",
        "GAN TZI YANG",
        "GAN YU XIN",
        "GOH JIA LING",
        "JANICE NGOH",
        "JAYDEN WONG",
        "JENNY ANG",
        "KEVIN TOW",
        "LAU WEI JIE",
        "LAU ZHI XUAN",
        "LIM ZHI YAANG",
        "LOH YA XUAN",
        "ARIF WAFIY",
        "NG TIN WEI",
        "NG ZI NING",
        "NIVEDHANRAJ",
        "TAN JAY DEN",
        "TAN WEI CHENG",
        "TEH ZHI JIN",
        "THOR LI JUN",
        "TOH WU SIANG",
        "WANG HONG YONG"
      ];

      // Plain T-Shirt Colors from Alex Ngoh's 22-Color Catalog (RM10 + A4 Front/Back)
      const C_ROYAL  = { key: "royal",   colorHex: "#2457ba", hiHex: "#3972e0", loHex: "#153980", collarHex: "#1b4598", labelHex: "#1b4494", isLight: false };
      const C_DKPURP = { key: "dkpurp",  colorHex: "#44306b", hiHex: "#5d448f", loHex: "#2a1c47", collarHex: "#362558", labelHex: "#342454", isLight: false };
      const C_DKGRN  = { key: "dkgreen", colorHex: "#214939", hiHex: "#2f644e", loHex: "#142e23", collarHex: "#1a3b2e", labelHex: "#1a3b2e", isLight: false };
      const C_WHITE  = { key: "white",   colorHex: "#f5f4ef", hiHex: "#ffffff", loHex: "#dedbd2", collarHex: "#ebe9e2", labelHex: "#e3e0d7", isLight: true };
      const C_GREY   = { key: "grey",    colorHex: "#8d9094", hiHex: "#a3a6aa", loHex: "#6e7175", collarHex: "#7e8185", labelHex: "#777a7e", isLight: true };

      const PAGES = [
        { id: 1,  design: 1, side: "front", ...C_ROYAL,  zh: "款式 1（像素潮酷）• 正面 • 04 宝蓝 (RM10)", bm: "Reka Bentuk 1 (Piksel) • Depan • 04 Biru Diraja", short: "1蓝正" },
        { id: 2,  design: 1, side: "back",  ...C_ROYAL,  zh: "款式 1（像素潮酷）• 背面 • 04 宝蓝 (RM10)", bm: "Reka Bentuk 1 (Piksel) • Belakang • 04 Biru Diraja", short: "1蓝背" },
        { id: 3,  design: 1, side: "front", ...C_DKPURP, zh: "款式 1（像素潮酷）• 正面 • 06 深紫 (RM10)", bm: "Reka Bentuk 1 (Piksel) • Depan • 06 Ungu Gelap", short: "1紫正" },
        { id: 4,  design: 1, side: "back",  ...C_DKPURP, zh: "款式 1（像素潮酷）• 背面 • 06 深紫 (RM10)", bm: "Reka Bentuk 1 (Piksel) • Belakang • 06 Ungu Gelap", short: "1紫背" },

        { id: 5,  design: 2, side: "front", ...C_DKGRN,  zh: "款式 2（韩系登机牌）• 正面 • 14 深青 (RM10)", bm: "Reka Bentuk 2 (Kolej Moden) • Depan • 14 Hijau Gelap", short: "2青正" },
        { id: 6,  design: 2, side: "back",  ...C_DKGRN,  zh: "款式 2（韩系登机牌）• 背面 • 14 深青 (RM10)", bm: "Reka Bentuk 2 (Kolej Moden) • Belakang • 14 Hijau Gelap", short: "2青背" },
        { id: 7,  design: 2, side: "front", ...C_WHITE,  zh: "款式 2（韩系登机牌）• 正面 • 01 白色 (RM10)", bm: "Reka Bentuk 2 (Kolej Moden) • Depan • 01 Putih", short: "2白正" },
        { id: 8,  design: 2, side: "back",  ...C_WHITE,  zh: "款式 2（韩系登机牌）• 背面 • 01 白色 (RM10)", bm: "Reka Bentuk 2 (Kolej Moden) • Belakang • 01 Putih", short: "2白背" },

        { id: 9,  design: 3, side: "front", ...C_WHITE,  zh: "款式 3（涂鸦贴纸）• 正面 • 01 白色 (RM10)", bm: "Reka Bentuk 3 (Doodle Ceria) • Depan • 01 Putih", short: "3白正" },
        { id: 10, design: 3, side: "back",  ...C_WHITE,  zh: "款式 3（涂鸦贴纸）• 背面 • 01 白色 (RM10)", bm: "Reka Bentuk 3 (Doodle Ceria) • Belakang • 01 Putih", short: "3白背" },
        { id: 11, design: 3, side: "front", ...C_GREY,   zh: "款式 3（涂鸦贴纸）• 正面 • 17 灰色 (RM10)", bm: "Reka Bentuk 3 (Doodle Ceria) • Depan • 17 Kelabu", short: "3灰正" },
        { id: 12, design: 3, side: "back",  ...C_GREY,   zh: "款式 3（涂鸦贴纸）• 背面 • 17 灰色 (RM10)", bm: "Reka Bentuk 3 (Doodle Ceria) • Belakang • 17 Kelabu", short: "3灰背" }
      ];

      function buildRoster(inkMain, inkAccent, startY, lineGap, fontSize = 12.8) {
        const left = STUDENTS.slice(0, 14);
        const right = STUDENTS.slice(14, 27);
        let svg = "";

        left.forEach((name, i) => {
          const y = startY + i * lineGap;
          svg += `<text x="440" y="${y}" text-anchor="end" fill="${inkMain}" font-size="${fontSize}" font-weight="800" letter-spacing="0.25">${name}</text>`;
        });

        right.forEach((name, i) => {
          const y = startY + i * lineGap;
          svg += `<text x="460" y="${y}" text-anchor="start" fill="${inkMain}" font-size="${fontSize}" font-weight="800" letter-spacing="0.25">${name}</text>`;
        });

        const endY = startY + 13 * lineGap;
        svg += `<text x="460" y="${endY}" text-anchor="start" fill="${inkAccent}" font-size="${fontSize}" font-weight="900" letter-spacing="0.4">★ 6M • 2026</text>`;
        return svg;
      }

      function star4(cx, cy, r, fill) {
        const ir = r * 0.28;
        return `<path d="M${cx},${cy - r} L${cx + ir},${cy - ir} L${cx + r},${cy} L${cx + ir},${cy + ir} L${cx},${cy + r} L${cx - ir},${cy + ir} L${cx - r},${cy} L${cx - ir},${cy - ir} Z" fill="${fill}"/>`;
      }

      function buildArtwork(cfg) {
        const { design, side, key } = cfg;

        // ============================================================
        // DESIGN 1: CYBER-PIXEL ARCADE (A4 Front & A4 Back)
        // ============================================================
        if (design === 1) {
          const neonLime = "#e6ff4d";
          const cyan     = "#5cf2ff";
          const pinkPop  = "#ff70b8";
          const white    = "#ffffff";
          const winBg    = key === "dkpurp" ? "rgba(22, 12, 42, 0.72)" : "rgba(10, 22, 56, 0.72)";

          if (side === "front") {
            return `
              <path d="M298,248 H602 V260 H614 V486 H602 V498 H298 V486 H286 V260 H298 Z"
                    fill="${winBg}" stroke="${cyan}" stroke-width="3.5"/>
              <rect x="298" y="256" width="304" height="24" fill="${cyan}" opacity="0.22"/>
              <rect x="308" y="264" width="8" height="8" fill="${pinkPop}"/>
              <rect x="320" y="264" width="8" height="8" fill="${neonLime}"/>
              <rect x="332" y="264" width="8" height="8" fill="${cyan}"/>
              <text x="592" y="273" text-anchor="end" fill="${cyan}" font-size="12" font-weight="900" letter-spacing="1.5">LEVEL 06 • 2026</text>

              <g transform="translate(450, 304)">
                <rect x="-32" y="-6" width="64" height="8" fill="${neonLime}"/>
                <rect x="-20" y="-12" width="40" height="6" fill="${neonLime}"/>
                <rect x="-12" y="-16" width="24" height="4" fill="${white}"/>
                <rect x="-18" y="2" width="36" height="12" fill="${cyan}"/>
                <rect x="26" y="2" width="4" height="16" fill="${pinkPop}"/>
                <rect x="24" y="18" width="8" height="6" fill="${neonLime}"/>
              </g>

              <text x="456" y="401" text-anchor="middle" fill="${pinkPop}" font-size="78" font-weight="900" letter-spacing="4">6M</text>
              <text x="453" y="398" text-anchor="middle" fill="${cyan}" font-size="78" font-weight="900" letter-spacing="4">6M</text>
              <text x="449" y="394" text-anchor="middle" fill="${white}" font-size="78" font-weight="900" letter-spacing="4">6M</text>

              <rect x="330" y="352" width="6" height="6" fill="${neonLime}"/>
              <rect x="324" y="358" width="6" height="6" fill="${neonLime}"/>
              <rect x="336" y="358" width="6" height="6" fill="${neonLime}"/>
              <rect x="330" y="364" width="6" height="6" fill="${neonLime}"/>

              <rect x="564" y="352" width="6" height="6" fill="${pinkPop}"/>
              <rect x="558" y="358" width="6" height="6" fill="${pinkPop}"/>
              <rect x="570" y="358" width="6" height="6" fill="${pinkPop}"/>
              <rect x="564" y="364" width="6" height="6" fill="${pinkPop}"/>

              <text x="450" y="432" text-anchor="middle" fill="${white}" font-size="24" font-weight="900" letter-spacing="2">武吉港脚南华学校</text>

              <rect x="318" y="450" width="264" height="28" rx="4" fill="rgba(0,0,0,0.45)" stroke="${neonLime}" stroke-width="2.2"/>
              <rect x="323" y="455" width="236" height="18" fill="${neonLime}"/>
              <text x="450" y="469" text-anchor="middle" fill="#141824" font-size="14" font-weight="900" letter-spacing="1.4">100%  2026 毕业解锁!</text>
            `;
          }

          return `
            <path d="M288,256 H612 V268 H622 V764 H612 V776 H288 V764 H278 V268 H288 Z"
                  fill="${winBg}" stroke="${cyan}" stroke-width="3"/>
            <rect x="288" y="262" width="324" height="28" fill="${cyan}" opacity="0.22"/>
            <rect x="298" y="272" width="9" height="9" fill="${pinkPop}"/>
            <rect x="312" y="272" width="9" height="9" fill="${neonLime}"/>
            <rect x="326" y="272" width="9" height="9" fill="${cyan}"/>
            <text x="602" y="282" text-anchor="end" fill="${neonLime}" font-size="13" font-weight="900" letter-spacing="1.2">27/27 READY</text>

            <text x="450" y="326" text-anchor="middle" fill="${neonLime}" font-size="24" font-weight="900" letter-spacing="2.2">6M • 玩家全员集合</text>
            <text x="450" y="354" text-anchor="middle" fill="${cyan}" font-size="15.5" font-weight="800" letter-spacing="2">武吉港脚南华学校</text>

            <line x1="298" y1="368" x2="602" y2="368" stroke="${cyan}" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.65"/>
            <line x1="450" y1="380" x2="450" y2="708" stroke="${cyan}" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.35"/>

            ${buildRoster(white, neonLime, 396, 23.4, 12.8)}

            <rect x="316" y="726" width="268" height="36" rx="6" fill="${neonLime}"/>
            <text x="450" y="750" text-anchor="middle" fill="#141824" font-size="18" font-weight="900" letter-spacing="1.8">▶ 下一关：中学见！</text>
          `;
        }

        // ============================================================
        // DESIGN 2: NEO-VARSITY BOARDING PASS (A4 Front & A4 Back)
        // ============================================================
        if (design === 2) {
          const isWhite  = key === "white";
          const mainInk  = isWhite ? "#1c4735" : "#fbf5e6";
          const goldInk  = isWhite ? "#d18a17" : "#ffd257";
          const subInk   = isWhite ? "#c44536" : "#8ae3b8";
          const cardFill = isWhite ? "rgba(28, 71, 53, 0.045)" : "rgba(10, 26, 18, 0.42)";

          if (side === "front") {
            return `
              <g stroke="${goldInk}" fill="none" stroke-width="2.4">
                <circle cx="450" cy="284" r="24"/>
                <ellipse cx="450" cy="284" rx="11" ry="24"/>
                <line x1="426" y1="284" x2="474" y2="284"/>
              </g>
              ${star4(408, 274, 7, subInk)}
              ${star4(492, 274, 7, subInk)}

              <text x="450" y="384" text-anchor="middle" fill="${mainInk}" font-size="76" font-weight="900" letter-spacing="5">6M</text>
              <line x1="336" y1="402" x2="564" y2="402" stroke="${goldInk}" stroke-width="3"/>

              <text x="450" y="438" text-anchor="middle" fill="${mainInk}" font-size="25" font-weight="900" letter-spacing="2.4">武吉港脚南华学校</text>

              <rect x="330" y="456" width="240" height="36" rx="6" fill="none" stroke="${mainInk}" stroke-width="2.2"/>
              <text x="450" y="480" text-anchor="middle" fill="${goldInk}" font-size="17.5" font-weight="900" letter-spacing="2.2">2026 • 六年限定版</text>
            `;
          }

          return `
            <path d="M296,256 H604 A18,18 0 0 0 622,274 V690 A16,16 0 0 0 608,706 A16,16 0 0 0 622,722 V762 A18,18 0 0 0 604,780 H296 A18,18 0 0 0 278,762 V722 A16,16 0 0 0 292,706 A16,16 0 0 0 278,690 V274 A18,18 0 0 0 296,256 Z"
                  fill="${cardFill}" stroke="${mainInk}" stroke-width="3"/>

            <text x="300" y="292" text-anchor="start" fill="${goldInk}" font-size="15.5" font-weight="900" letter-spacing="1.2">武吉港脚南华学校</text>
            <text x="600" y="292" text-anchor="end" fill="${subInk}" font-size="15.5" font-weight="900" letter-spacing="1.2">6M ✈ 未来</text>

            <text x="450" y="336" text-anchor="middle" fill="${mainInk}" font-size="27" font-weight="900" letter-spacing="3">2026 毕业登机牌</text>
            <line x1="298" y1="352" x2="602" y2="352" stroke="${goldInk}" stroke-width="2"/>

            <line x1="450" y1="368" x2="450" y2="692" stroke="${mainInk}" stroke-width="1" stroke-dasharray="3 5" opacity="0.32"/>
            ${buildRoster(mainInk, goldInk, 384, 22.8, 12.8)}

            <line x1="296" y1="706" x2="604" y2="706" stroke="${mainInk}" stroke-width="2" stroke-dasharray="7 6" opacity="0.6"/>

            <g fill="${mainInk}" opacity="0.88" transform="translate(300, 722)">
              <rect x="0" y="0" width="4" height="36"/>
              <rect x="7" y="0" width="2" height="36"/>
              <rect x="12" y="0" width="6" height="36"/>
              <rect x="21" y="0" width="2" height="36"/>
              <rect x="26" y="0" width="4" height="36"/>
              <rect x="33" y="0" width="5" height="36"/>
              <rect x="41" y="0" width="2" height="36"/>
              <rect x="46" y="0" width="6" height="36"/>
              <rect x="55" y="0" width="3" height="36"/>
            </g>
            <text x="598" y="741" text-anchor="end" fill="${goldInk}" font-size="18.5" font-weight="900" letter-spacing="2">永远的六M</text>
            <text x="598" y="762" text-anchor="end" fill="${mainInk}" font-size="14" font-weight="800" letter-spacing="2">一路顺风 • 2026</text>
          `;
        }

        // ============================================================
        // DESIGN 3: STREET-DOODLE STICKER POP (A4 Front & A4 Back)
        // ============================================================
        const outline = "#192638";
        const cobalt  = "#2962ff";
        const coral   = "#ff5c77";
        const sunny   = "#ffd23f";
        const stickerCard = key === "grey" ? "#ffffff" : "#f0f5ff";

        if (side === "front") {
          return `
            <g transform="rotate(-3 450 380)">
              <rect x="296" y="264" width="308" height="222" rx="34" fill="${stickerCard}" stroke="${outline}" stroke-width="5"/>
              <rect x="302" y="270" width="296" height="210" rx="28" fill="none" stroke="${cobalt}" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>

              <g transform="translate(500, 294) rotate(14)">
                <polygon points="0,-16 32,-4 0,8 -32,-4" fill="${coral}" stroke="${outline}" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M-16,4 L-16,15 C-16,19 16,19 16,15 L16,4 L0,10 Z" fill="${sunny}" stroke="${outline}" stroke-width="3"/>
                <line x1="26" y1="-2" x2="28" y2="16" stroke="${outline}" stroke-width="3" stroke-linecap="round"/>
                <circle cx="28" cy="18" r="4" fill="${sunny}" stroke="${outline}" stroke-width="2.5"/>
              </g>

              <text x="454" y="392" text-anchor="middle" fill="${sunny}" stroke="${outline}" stroke-width="11" paint-order="stroke" font-size="80" font-weight="900" letter-spacing="4">6M</text>
              <text x="448" y="387" text-anchor="middle" fill="${cobalt}" stroke="${outline}" stroke-width="6" paint-order="stroke" font-size="80" font-weight="900" letter-spacing="4">6M</text>

              <g transform="translate(342, 326) rotate(-12)">
                <circle cx="0" cy="0" r="19" fill="${sunny}" stroke="${outline}" stroke-width="3.5"/>
                <circle cx="-6" cy="-3" r="2.2" fill="${outline}"/>
                <circle cx="6" cy="-3" r="2.2" fill="${outline}"/>
                <path d="M-6,4 Q0,10 6,4" fill="none" stroke="${outline}" stroke-width="2.6" stroke-linecap="round"/>
              </g>

              <text x="450" y="428" text-anchor="middle" fill="${outline}" font-size="23" font-weight="900" letter-spacing="1.8">武吉港脚南华学校</text>

              <rect x="342" y="442" width="216" height="36" rx="18" fill="${coral}" stroke="${outline}" stroke-width="3.5"/>
              <text x="450" y="467" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900" letter-spacing="2">2026 毕业啦！</text>
            </g>

            ${star4(592, 266, 13, sunny)}
            ${star4(302, 474, 11, coral)}
          `;
        }

        return `
          <rect x="304" y="256" width="292" height="46" rx="23" fill="${sunny}" stroke="${outline}" stroke-width="4"/>
          <text x="450" y="286" text-anchor="middle" fill="${outline}" font-size="22" font-weight="900" letter-spacing="2.2">我们毕业啦 • 6M</text>

          <g transform="translate(302, 266) rotate(-14)">
            <circle cx="0" cy="0" r="15" fill="${coral}" stroke="${outline}" stroke-width="3"/>
            <circle cx="-4.5" cy="-2" r="1.8" fill="#ffffff"/>
            <circle cx="4.5" cy="-2" r="1.8" fill="#ffffff"/>
            <path d="M-5,3 Q0,8 5,3" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          ${star4(598, 268, 12, coral)}

          <rect x="278" y="318" width="344" height="394" rx="28" fill="${stickerCard}" stroke="${outline}" stroke-width="4.5"/>
          <text x="450" y="346" text-anchor="middle" fill="${cobalt}" font-size="16" font-weight="900" letter-spacing="2">★ 武吉港脚南华学校 ★</text>
          <line x1="302" y1="358" x2="598" y2="358" stroke="${outline}" stroke-width="2" stroke-dasharray="6 5" opacity="0.35"/>

          ${buildRoster(outline, coral, 384, 23.2, 12.8)}

          <g transform="rotate(1.5 450 752)">
            <rect x="312" y="728" width="276" height="42" rx="21" fill="${cobalt}" stroke="${outline}" stroke-width="4"/>
            <text x="450" y="756" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="900" letter-spacing="2.2">青春万岁 • 快乐出发！</text>
          </g>
        `;
      }

      function buildShirtSvg(cfg) {
        const uid = `p${cfg.id}`;
        const isFront = cfg.side === "front";
        const stitchColor = cfg.isLight ? "rgba(0,0,0,0.16)" : "rgba(255,255,255,0.22)";
        const creaseDark  = cfg.isLight ? "rgba(55,52,46,0.2)" : "rgba(0,0,0,0.3)";
        const creaseLight = cfg.isLight ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.16)";

        const bodyPath = isFront
          ? "M360,82 C388,162 512,162 540,82 L674,122 L822,318 L704,400 L646,312 L646,842 C646,862 634,872 612,872 L288,872 C266,872 254,862 254,842 L254,312 L196,400 L78,318 L226,122 Z"
          : "M356,82 C398,108 502,108 544,82 L674,122 L822,318 L704,400 L646,312 L646,842 C646,862 634,872 612,872 L288,872 C266,872 254,862 254,842 L254,312 L196,400 L78,318 L226,122 Z";

        const collarMarkup = isFront
          ? `
            <path d="M358,82 C402,94 498,94 542,82 C516,158 384,158 358,82 Z" fill="${cfg.loHex}"/>
            <rect x="427" y="96" width="46" height="25" rx="4" fill="${cfg.labelHex}" opacity="0.92"/>
            <text x="450" y="112" text-anchor="middle" fill="${cfg.key === 'white' ? '#444' : '#fff'}" font-size="9" font-weight="800" opacity="0.85">6M</text>
            <path d="M348,85 C382,174 518,174 552,85 L536,80 C508,154 392,154 364,80 Z" fill="${cfg.collarHex}" stroke="${stitchColor}" stroke-width="1.5"/>
          `
          : `
            <path d="M352,83 C396,112 504,112 548,83 L539,74 C498,98 402,98 361,74 Z" fill="${cfg.collarHex}" stroke="${stitchColor}" stroke-width="1.5"/>
          `;

        return `
          <svg class="shirt-svg" viewBox="0 0 900 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${cfg.zh} / ${cfg.bm}">
            <defs>
              <filter id="weave_${uid}" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" result="noise"/>
                <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.065 0" in="noise" result="softNoise"/>
                <feComposite in="softNoise" in2="SourceGraphic" operator="atop"/>
              </filter>

              <radialGradient id="torsoLight_${uid}" cx="50%" cy="37%" r="58%">
                <stop offset="0%" stop-color="${cfg.hiHex}"/>
                <stop offset="56%" stop-color="${cfg.colorHex}"/>
                <stop offset="100%" stop-color="${cfg.loHex}"/>
              </radialGradient>

              <linearGradient id="sideShade_${uid}" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="${creaseDark}"/>
                <stop offset="15%" stop-color="transparent"/>
                <stop offset="85%" stop-color="transparent"/>
                <stop offset="100%" stop-color="${creaseDark}"/>
              </linearGradient>

              <clipPath id="clipShirt_${uid}">
                <path d="${bodyPath}"/>
              </clipPath>
            </defs>

            <path d="${bodyPath}" fill="url(#torsoLight_${uid})"/>

            <g clip-path="url(#clipShirt_${uid})">
              <rect x="78" y="80" width="744" height="800" fill="url(#sideShade_${uid})"/>

              <path d="M254,312 C282,324 308,356 318,402" fill="none" stroke="${creaseDark}" stroke-width="15" stroke-linecap="round" opacity="0.25"/>
              <path d="M646,312 C618,324 592,356 582,402" fill="none" stroke="${creaseDark}" stroke-width="15" stroke-linecap="round" opacity="0.25"/>
              <path d="M274,742 C340,768 560,768 626,742" fill="none" stroke="${creaseLight}" stroke-width="24" opacity="0.22"/>
              <path d="M282,810 C360,830 540,830 618,810" fill="none" stroke="${creaseDark}" stroke-width="18" opacity="0.18"/>

              <path d="M226,122 C245,190 250,255 254,312" fill="none" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>
              <path d="M674,122 C655,190 650,255 646,312" fill="none" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>

              <line x1="86" y1="304" x2="206" y2="386" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>
              <line x1="814" y1="304" x2="694" y2="386" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>
              <line x1="254" y1="846" x2="646" y2="846" stroke="${stitchColor}" stroke-width="2" stroke-dasharray="4 4"/>
              <line x1="254" y1="853" x2="646" y2="853" stroke="${stitchColor}" stroke-width="1.5" stroke-dasharray="4 4"/>

              <g id="print_${uid}">
                ${buildArtwork(cfg)}
              </g>

              <rect x="78" y="80" width="744" height="800" fill="transparent" filter="url(#weave_${uid})"/>
              <ellipse cx="450" cy="480" rx="225" ry="265" fill="${creaseLight}" opacity="0.06" pointer-events="none"/>
            </g>

            ${collarMarkup}
            <path d="${bodyPath}" fill="none" stroke="${cfg.isLight ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.16)'}" stroke-width="2"/>
          </svg>
        `;
      }

      const viewport = document.getElementById("viewport");
      const pagesHost = document.getElementById("pagesHost");
      const bottomHud = document.getElementById("bottomHud");
      const hudTitleZh = document.getElementById("hudTitleZh");
      const hudTitleBm = document.getElementById("hudTitleBm");
      const hudColorChip = document.getElementById("hudColorChip");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const zoomBtn = document.getElementById("zoomBtn");
      const backdropBtn = document.getElementById("backdropBtn");

      let currentIdx = 0;

      PAGES.forEach((cfg, idx) => {
        const sec = document.createElement("section");
        sec.className = "shirt-page" + (idx === 0 ? " active" : "");
        sec.dataset.side = cfg.side;
        sec.innerHTML = `<div class="shirt-canvas-wrap">${buildShirtSvg(cfg)}</div>`;
        sec.querySelector(".shirt-canvas-wrap").addEventListener("click", () => toggleZoom());
        pagesHost.appendChild(sec);

        if (idx > 0 && idx % 4 === 0) {
          const div = document.createElement("span");
          div.className = "divider-bar";
          bottomHud.appendChild(div);
        }

        const dot = document.createElement("button");
        dot.className = "page-dot" + (idx === 0 ? " active" : "");
        dot.textContent = cfg.short;
        dot.setAttribute("aria-label", `${cfg.zh} / ${cfg.bm}`);
        dot.addEventListener("click", () => goToPage(idx));
        bottomHud.appendChild(dot);
      });

      const pageEls = Array.from(document.querySelectorAll(".shirt-page"));
      const dotEls = Array.from(document.querySelectorAll(".page-dot"));

      function updateHud() {
        const cfg = PAGES[currentIdx];
        hudTitleZh.textContent = cfg.zh;
        hudTitleBm.textContent = cfg.bm;
        hudColorChip.style.background = cfg.colorHex;
        prevBtn.disabled = currentIdx === 0;
        nextBtn.disabled = currentIdx === PAGES.length - 1;
        dotEls[currentIdx].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }

      function goToPage(idx) {
        if (idx < 0 || idx >= PAGES.length || idx === currentIdx) return;
        pageEls[currentIdx].classList.remove("active");
        dotEls[currentIdx].classList.remove("active");
        currentIdx = idx;
        pageEls[currentIdx].classList.add("active");
        dotEls[currentIdx].classList.add("active");
        updateHud();
      }

      function toggleZoom(forceState) {
        const nextState = typeof forceState === "boolean" ? forceState : !viewport.classList.contains("zoomed");
        viewport.classList.toggle("zoomed", nextState);
        zoomBtn.classList.toggle("active", nextState);
        zoomBtn.setAttribute("aria-pressed", String(nextState));
      }

      zoomBtn.addEventListener("click", () => toggleZoom());

      backdropBtn.addEventListener("click", () => {
        const isDark = document.body.getAttribute("data-backdrop") === "dark";
        document.body.setAttribute("data-backdrop", isDark ? "light" : "dark");
        backdropBtn.classList.toggle("active", !isDark);
        backdropBtn.setAttribute("aria-pressed", String(!isDark));
      });

      prevBtn.addEventListener("click", () => goToPage(currentIdx - 1));
      nextBtn.addEventListener("click", () => goToPage(currentIdx + 1));

      document.addEventListener("keydown", e => {
        if (e.key === "ArrowRight" || e.key === "PageDown") {
          e.preventDefault();
          goToPage(currentIdx + 1);
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          goToPage(currentIdx - 1);
        } else if (e.key === " " || e.key === "z" || e.key === "Z") {
          e.preventDefault();
          toggleZoom();
        }
      });

      let touchX = 0;
      let touchY = 0;
      viewport.addEventListener("touchstart", e => {
        touchX = e.changedTouches[0].screenX;
        touchY = e.changedTouches[0].screenY;
      }, { passive: true });

      viewport.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].screenX - touchX;
        const dy = e.changedTouches[0].screenY - touchY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) goToPage(currentIdx + 1);
          else goToPage(currentIdx - 1);
        }
      }, { passive: true });

      updateHud();
    })();
  </script>
</body>
</html>
